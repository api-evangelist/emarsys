method: derived
source: >-
  openapi/ (23 SAP Emarsys Core API specifications + 2 SMS Partner API
  specifications, 136 operations), enriched from the developer-hub Concepts page
  https://dev.emarsys.com/docs/emarsys-core-api-guides/75f3acc2c94dc-concepts
note: >-
  Derived from path structure and id path-parameters rather than from schema
  $refs, because the Core API specs are Swagger 2.0 documents that model almost
  every request and response body as a free-form object with a single shared
  "Default Response" definition. That is itself the most important fact about this
  data model: THE CONTRACT DOES NOT CARRY THE SCHEMA. Of the 21 Swagger 2.0
  documents, 19 define exactly one definition each, so a consumer cannot learn the
  shape of a contact, a campaign or a segment from the spec — only from prose and
  examples.

  The second structural fact an integrator must internalise: contacts have no
  fixed attribute set. A contact is a bag of NUMERIC FIELD IDS ("3" is email,
  "1" is first name, "2" is last name on a default account), and custom fields
  add more ids per account. Payloads therefore use field ids as JSON object keys,
  which the specs express as regex-patterned additionalProperties. Any client must
  call listAvailableFields first and resolve names to ids at runtime; there is no
  account-independent contact schema.
id_conventions:
  contact: >-
    Two id spaces coexist. The INTERNAL contact id is Emarsys-generated. The
    EXTERNAL key is any indexed field, selected per request via key_id / key_value
    (commonly field 3, email). getContactId maps external to internal;
    verifyContactInternalIdentifiers checks internal ids exist. Using a custom
    field as key_id requires that field to be indexed by Emarsys Support.
  fields: Numeric identifiers, account-scoped, resolved with listAvailableFields.
  numeric_ids: >-
    emailId, listId, segmentId, eventId, formId, templateId, sectionId, linkId,
    profileId, administratorId, sourceId are all opaque numeric ids. No typed
    prefixes anywhere in the API.
  async_handles: >-
    runId (segment runs) and queryId (email response metrics) are job handles, not
    entity ids — submit, then poll.
