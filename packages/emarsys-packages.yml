method: searched
source: >-
  npm registry.npmjs.org, Packagist repo.packagist.org, RubyGems, PyPI, Maven
  Central, pub.dev, CocoaPods trunk, NuGet, and the emartech GitHub organization
  (https://github.com/emartech) that SAP Emarsys publishes its client libraries from
note: >-
  SAP Emarsys ships two distinct families of first-party library. (1) API client
  wrappers for the Core API — suite-js-sdk (Node) and php-suite-api (PHP) — which
  carry WSSE/OIDC auth and the v2 endpoint surface. (2) Mobile/omnichannel SDKs
  (Android, iOS, React Native, Flutter, Expo, MAUI) that instrument apps for
  Mobile Engage and Predict rather than calling the Core API. Both are recorded
  here; official:true is set only for packages published from the emartech org.
  The escher-* libraries implement Emarsys' Escher HTTP request-signing scheme
  used between Emarsys services — first-party, but not Core API clients.
