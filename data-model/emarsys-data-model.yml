  note: >-
    19 of the 21 Swagger 2.0 documents carry exactly one definition — the shared
    "Default Response" envelope. Only Relational Data (7 definitions) models real
    request/response schemas. The 4 OpenAPI 3.x documents (Email Reporting, Bulk
    Response Summary, SMS Partner Service, SMS Partner Callbacks) are the only
