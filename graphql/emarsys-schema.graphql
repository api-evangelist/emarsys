  updatedAt: DateTime!
  statistics: PushCampaignStatistics
}

type PushCampaignConnection {
  nodes: [PushCampaign!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PushCampaignStatistics {
  sent: Int!
  delivered: Int!
  opened: Int!
  dismissed: Int!
  deliveryRate: Float!
  openRate: Float!
}

# ─── Ads Types ─────────────────────────────────────────────────────────────────

type AdCampaign {
  id: ID!
  name: String!
  platform: AdPlatform!
  type: AdCampaignType!
  audienceId: ID
  segment: Segment
  status: CampaignStatus!
  budget: Float
  startDate: Date
  endDate: Date
  createdAt: DateTime!
  updatedAt: DateTime!
  statistics: AdCampaignStatistics
}

type AdCampaignConnection {
  nodes: [AdCampaign!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AdCampaignStatistics {
  impressions: Int!
  clicks: Int!
  conversions: Int!
  spend: Float!
  ctr: Float!
  conversionRate: Float!
  roas: Float!
}

# ─── Content / Personalization ─────────────────────────────────────────────────

type ContentBlock {
  id: ID!
  name: String!
  contentHtml: String!
  category: String
  tags: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ContentBlockConnection {
  nodes: [ContentBlock!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PersonalizedContent {
  contactId: ID!
  contentId: ID!
  renderedHtml: String!
  variables: JSON
}

# ─── Analytics / Reports ───────────────────────────────────────────────────────

type CampaignStatistics {
  campaignId: ID!
  sent: Int!
  delivered: Int!
  bounced: Int!
  hardBounced: Int!
  softBounced: Int!
  opened: Int!
  uniqueOpened: Int!
  clicked: Int!
  uniqueClicked: Int!
  unsubscribed: Int!
  complained: Int!
  revenue: Float
  openRate: Float!
  clickRate: Float!
  bounceRate: Float!
  unsubscribeRate: Float!
  clickToOpenRate: Float!
  dateFrom: DateTime
  dateTo: DateTime
}

type AggregatedReport {
  period: ReportPeriod!
  campaigns: [CampaignSummary!]!
  totalSent: Int!
  totalDelivered: Int!
  totalOpened: Int!
  totalClicked: Int!
  averageOpenRate: Float!
  averageClickRate: Float!
}

type CampaignSummary {
  campaignId: ID!
  campaignName: String!
  sent: Int!
  openRate: Float!
  clickRate: Float!
}

# ─── Data Export ───────────────────────────────────────────────────────────────

type DataExport {
  id: ID!
  type: ExportType!
  status: ExportStatus!
  format: ExportFormat!
  filter: JSON
  fileUrl: String
  createdAt: DateTime!
  completedAt: DateTime
  expiresAt: DateTime
}

type DataExportConnection {
  nodes: [DataExport!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# ─── Account / User Types ──────────────────────────────────────────────────────

type Account {
  id: ID!
  name: String!
  timezone: String!
  locale: String!
  emailAddress: String!
  subscriptionType: String
  featureFlags: [String!]
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  role: UserRole!
  status: UserStatus!
  lastLoginAt: DateTime
  createdAt: DateTime!
}

type UserConnection {
  nodes: [User!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# ─── Payload / Response Types ──────────────────────────────────────────────────

type ContactPayload {
  contact: Contact
  errors: [UserError!]
}

type BatchContactPayload {
  contacts: [Contact!]
  failedCount: Int!
  errors: [UserError!]
}

type ContactListPayload {
  contactList: ContactList
  errors: [UserError!]
}

type EmailCampaignPayload {
  campaign: EmailCampaign
  errors: [UserError!]
}

type LaunchPayload {
  launch: Launch
  errors: [UserError!]
}

type ExternalEventPayload {
  event: ExternalEvent
  errors: [UserError!]
}

type ExternalEventTriggerPayload {
  success: Boolean!
  triggeredAt: DateTime
  errors: [UserError!]
}

type ProgramPayload {
  program: Program
  errors: [UserError!]
}

type ProgramEnrollmentPayload {
  enrollment: ProgramEnrollment
  errors: [UserError!]
}

type SmsCampaignPayload {
  campaign: SmsCampaign
  errors: [UserError!]
}

type PushCampaignPayload {
  campaign: PushCampaign
  errors: [UserError!]
}

type DataExportPayload {
  dataExport: DataExport
  errors: [UserError!]
}

type SendTestEmailPayload {
  success: Boolean!
  errors: [UserError!]
}

type DeletePayload {
  success: Boolean!
  id: ID
  errors: [UserError!]
}

type UserError {
  field: String
  message: String!
  code: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalPages: Int!
  currentPage: Int!
}

type FieldOption {
  id: ID!
  choice: String!
  externalId: String
}

# ─── Input Types ───────────────────────────────────────────────────────────────

input CreateContactInput {
  email: String
  firstName: String
  lastName: String
  phone: String
  mobilePhone: String
  dateOfBirth: Date
  gender: Gender
  customFields: [ContactFieldValueInput!]
  listIds: [ID!]
  optInStatus: OptInStatus
}

input UpdateContactInput {
  email: String
  firstName: String
  lastName: String
  phone: String
  mobilePhone: String
  dateOfBirth: Date
  gender: Gender
  customFields: [ContactFieldValueInput!]
  optInStatus: OptInStatus
}

input BatchUpdateContactInput {
  id: ID!
  input: UpdateContactInput!
}

input ContactFieldValueInput {
  fieldId: ID!
  value: String
}

input CreateContactListInput {
  name: String!
  type: ContactListType
}

input UpdateContactListInput {
  name: String
}

input CreateEmailCampaignInput {
  name: String!
  subject: String!
  fromName: String!
  fromEmail: String!
  replyTo: String
  contentHtml: String
  contentText: String
  templateId: ID
  type: CampaignType!
  language: String
}

input UpdateEmailCampaignInput {
  name: String
  subject: String
  fromName: String
  fromEmail: String
  replyTo: String
  contentHtml: String
  contentText: String
  language: String
}

input ScheduleLaunchInput {
  campaignId: ID!
  segmentId: ID
  listIds: [ID!]
  scheduledAt: DateTime
  timezone: String
  throttle: LaunchThrottleInput
}

input LaunchThrottleInput {
  enabled: Boolean!
  batchSize: Int
  batchIntervalMinutes: Int
}

input CreateExternalEventInput {
  name: String!
  description: String
}

input CreateSmsCampaignInput {
  name: String!
  message: String!
  sender: String
}

input SendSmsCampaignInput {
  segmentId: ID
  listIds: [ID!]
  scheduledAt: DateTime
}

input CreatePushCampaignInput {
  name: String!
  title: String!
  body: String!
  imageUrl: String
  actionUrl: String
  platform: [PushPlatform!]!
}

input SendPushCampaignInput {
  segmentId: ID
  listIds: [ID!]
  scheduledAt: DateTime
}

input CreateDataExportInput {
  type: ExportType!
  format: ExportFormat!
  filter: JSON
}

input ContactFilter {
  email: String
  optInStatus: OptInStatus
  segmentId: ID
  listId: ID
  createdAfter: DateTime
  createdBefore: DateTime
}

input CampaignFilter {
  status: CampaignStatus
  type: CampaignType
  createdAfter: DateTime
  createdBefore: DateTime
}

input LaunchFilter {
  campaignId: ID
  status: LaunchStatus
  scheduledAfter: DateTime
  scheduledBefore: DateTime
}

input ReportFilter {
  dateFrom: DateTime!
  dateTo: DateTime!
  campaignIds: [ID!]
  period: ReportPeriod
}

