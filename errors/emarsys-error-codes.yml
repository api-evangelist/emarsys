note: 'SAP Emarsys publishes a numeric error-code registry rather than RFC 9457 problem details. Every
  response carries an envelope of replyCode (integer), replyText (string) and data; replyCode 0 means
  success. The registry is split across four documentation pages by HTTP status class and is captured
  here verbatim, de-duplicated. Two things make this catalog operationally important: (1) Emarsys returns
  application-level FAILURES inside HTTP 200 responses — an agent that treats 2xx as success will silently
  miss ''no contact found'' and ''more than one contact found''; and (2) the same replyCode is reused
  across different HTTP statuses and different messages, so a client must key on the (status, replyCode)
  pair, not on replyCode alone.'
