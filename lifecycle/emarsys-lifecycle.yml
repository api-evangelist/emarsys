deprecation:
  policy_url: https://dev.emarsys.com/docs/changelog/z1yoegvlz20pg-changelog
  sunset_header: false
  deprecation_header: false
  practice: >-
    Emarsys announces deprecations as dated entries in the developer-hub
    changelog and marks the affected operation `deprecated: true` in the
    published OpenAPI. It does NOT emit RFC 8594 Sunset or Deprecation response
    headers, so the signal is documentation-only — an agent cannot learn at
    runtime that the operation it just called is on the way out.
  notice_period: >-
    Observed 12-24 months between the changelog announcement and the stated
    decommission date (Get response summary: announced 2024-03-25, decommission
    March 2026; List/Get contacts in a contact list: announced 2023-12-08,
    decommission December 2024).
  major_sunset:
    subject: WSSE authentication
    announced: '2024-11-08'
    sunset: '2026-12-31'
    replacement: OAuth 2.0 client credentials / OpenID Connect (v3)
    note: >-
      The single largest lifecycle event on this API. WSSE — the X-WSSE
      UsernameToken digest scheme that every v2 endpoint in openapi/ still
      declares as its security scheme — is deprecated with a final sunset at the
      end of 2026. Both schemes run in parallel until then.
