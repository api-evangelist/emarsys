aid: emarsys
name: SAP Emarsys
description: SAP Emarsys (formerly Emarsys, acquired by SAP in 2020 and now marketed as part of SAP Engagement
  Cloud) is an omnichannel customer engagement and marketing automation platform used by retail and consumer
  brands to run personalized email, SMS, mobile, web and ads campaigns from a unified customer data layer
  with AI-driven segmentation. The developer surface is the Emarsys Core API — 23 published endpoint batches
  covering contacts and custom contact fields, static contact lists and rule-based segments, email campaign
  creation, preview, test-send, launch and stop, delivery status and response-metric reporting, external
  event triggers that start Automation Centre programs, media assets, tracked links, account and API-user
  administration, and the Relational Data Store (RDS) custom-object layer for purchase and product data.
  A separately published SMS Partner API lets SMS aggregators integrate with the Emarsys SMS channel.
  Authentication is the legacy X-WSSE UsernameToken header, which SAP Emarsys has deprecated with a final
  sunset at the end of 2026 in favour of OAuth 2.0 client credentials / OpenID Connect on the v3 surface.
  Rate limiting is 1000 requests per minute per API user with published X-RateLimit-* headers, and errors
  are returned as a proprietary replyCode/replyText/data envelope that can carry failures inside HTTP
  200 responses.
type: Index
accessModel:
  pricing: contact-sales
  onboarding: sales-gate
  trial: false
  try_now: false
  public: false
  label: Enterprise sales, no self-serve signup
  confidence: high
  source:
  - https://emarsys.com/request-pricing/
  - https://emarsys.com/demo/
  - plans/emarsys-plans-pricing.yml
  note: >-
    Corrected 2026-08-13 from a derived "self-serve signup" reading. SAP Emarsys
    publishes no price list and no signup path — emarsys.com/pricing/ now 404s and
    the only routes in are a "Request pricing" lead form and a demo request.
    API credentials are created by an account owner inside an existing Emarsys
    account (Admin > Security Settings), so there is no way for a developer to
    obtain access without a customer contract.
  generated: '2026-08-13'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/emarsys.png
