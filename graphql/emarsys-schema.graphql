type SmsCampaignConnection {
  nodes: [SmsCampaign!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SmsCampaignStatistics {
  sent: Int!
  delivered: Int!
  failed: Int!
  clicked: Int!
  unsubscribed: Int!
