aid: emarsys
name: SAP Emarsys
description: SAP Emarsys (formerly Emarsys) is an omnichannel customer engagement
  and marketing automation platform that helps brands run personalized email, mobile,
  web, SMS, and ads campaigns powered by a unified customer data layer and AI-driven
  segmentation. The Emarsys API surface exposes contacts, segments, campaigns, automation
  programs, event triggers, external events, and analytics so marketing and engineering
  teams can integrate Emarsys with the rest of the stack. Authentication uses OAuth
  2.0 / OIDC with JWT for the v3 API, while legacy endpoints continue to use WSSE
  (being phased out by end of 2026).
