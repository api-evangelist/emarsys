method: searched
source: https://dev.emarsys.com/docs/emarsys-core-api-guides/cd1025a4f6b0d-miscellaneous
docs: https://dev.emarsys.com/docs/emarsys-core-api-guides/cd1025a4f6b0d-miscellaneous
test_live_separation: false
note: >-
  SAP Emarsys ships NO sandbox account, NO test/live key separation and NO magic
  test values. There is one production API host (api.emarsys.net), one credential
  type per API user, and no test-mode prefix on that credential — everything an
  integration does during development is done against live account data. What
  Emarsys does publish under "Try as You Go" is client tooling plus a small number
  of safe, non-destructive operations, catalogued below. The practical safety
  boundary a builder gets is the SEND path, not the environment: previewing and
  test-sending an email campaign are separate operations from launching it, so a
  campaign can be exercised end to end without mailing the recipient list.
environments:
- name: production
  base_url: https://api.emarsys.net/api/v2
  credential: X-WSSE API user (or OAuth 2.0 client credentials on v3)
  key_prefix: null
  note: The only environment. There is no separate sandbox host.
test_credentials: []
test_values: []
test_clock: false
fixtures: false
safe_operations:
- operation: openapi/emarsys-email-campaign-lifecycle-openapi.yml#previewEmailCampaignContents
  description: Renders campaign contents for a given contact without sending anything.
- operation: openapi/emarsys-email-campaign-lifecycle-openapi.yml#sendTestEmail
  description: >-
    Sends the campaign to a nominated test address instead of the campaign
    recipient source — the closest thing Emarsys offers to a test send.
- operation: openapi/emarsys-sms-partner-service-openapi.yml#testConnection
  description: >-
    Validates an SMS partner's configuration fields against the provider without
    dispatching a message.
- operation: healthcheck
  url: https://api.emarsys.net/healthcheck
  method: GET
  auth_required: false
  description: >-
    Unauthenticated liveness probe. Documented as the way to verify connectivity
    to Emarsys before authenticating.
tooling:
