  '/v2/email/{emailId}/version':
    post:
      summary: Version an Email Campaign
      description: |-
        Creates a new child version of the specified email campaign.

        Versioned campaigns are optimal for A/B testing, and can be manipulated as a separate email campaign through the API.

        **Tip:** List all versions of an email campaign with `root_campaign_id` filter on the [List email campaigns](https://dev.emarsys.com/docs/emarsys-api/b3A6MjQ4OTk4Njg) endpoint.
      operationId: versionEmailCampaign
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - name: emailId
          in: path
          description: The identifier of the email campaign.
          required: true
          type: integer
        - in: body
          name: body
          schema:
            type: object
            properties:
              original_name:
                type: string
                description: |-
                  The name of the original campaign to create a new version of.

                  **Important:** Only needed if the campaign has not been versioned yet.
              new_name:
                type: string
                description: The name of the new version of the campaign.
            required:
              - new_name
            x-examples:
              - original_name: Version A
                new_name: Version B
      schemes:
        - https
      responses:
        '200':
          description: ''
          schema:
            type: object
            description: 'See the example or [Response Codes](docs/response-codes/error-codes.md) for details.'
            additionalProperties: false
            properties:
              replyCode:
                type: integer
                description: 'The Emarsys [response code](docs/response-codes/error-codes.md).'
              replyText:
                type: string
                description: 'The summary of the [response](docs/response-codes/error-codes.md).'
              data:
                type: integer
                description: The identifier of the new campaign.
        '400':
          description: ''
          schema:
            $ref: '#/definitions/default-response'
      security:
        - X-WSSE: []
  '/v2/email/{emailId}/finalize':
    post:
      summary: Finalize a Multi-language Email Campaign
      description: |-
        During A/B testing of multi-language campaigns, two versions are sent to contacts with the same mother tongue living in the same country. Once the A/B testing is completed, finalize the email campaign using this endpoint. Contacts in the specified countries will then receive the successful version in their own languages.

        **Note:** This endpoint is only available if the *Multi-language Email Campaigns* feature is enabled for your account. Contact Emarsys Support for details.
      operationId: finalizeMultilanguageEmailCampaign
      produces:
        - application/json
      parameters:
        - name: emailId
          in: path
          description: The identifier of the email campaign.
          required: true
          type: integer
      schemes:
