"""
SAP Emarsys GraphQL Schema
Conceptual schema derived from the SAP Emarsys REST API.
Covers contact management, email campaigns, automation programs, segmentation,
personalization, event triggers, and marketing analytics.
"""

schema {
  query: Query
  mutation: Mutation
}

# ─── Root Types ────────────────────────────────────────────────────────────────

type Query {
  # Contacts
  contact(id: ID!): Contact
  contacts(filter: ContactFilter, page: Int, pageSize: Int): ContactConnection
  contactByEmail(email: String!): Contact
  contactField(id: ID!): ContactField
  contactFields(page: Int, pageSize: Int): ContactFieldConnection
  contactList(id: ID!): ContactList
  contactLists(page: Int, pageSize: Int): ContactListConnection

  # Segments
  segment(id: ID!): Segment
  segments(page: Int, pageSize: Int): SegmentConnection
  segmentContacts(segmentId: ID!, page: Int, pageSize: Int): ContactConnection

  # Email Campaigns
  emailCampaign(id: ID!): EmailCampaign
  emailCampaigns(filter: CampaignFilter, page: Int, pageSize: Int): EmailCampaignConnection
  emailTemplate(id: ID!): EmailTemplate
  emailTemplates(page: Int, pageSize: Int): EmailTemplateConnection

  # Launch Items
  launch(id: ID!): Launch
  launches(filter: LaunchFilter, page: Int, pageSize: Int): LaunchConnection

  # Automation Programs
  program(id: ID!): Program
  programs(page: Int, pageSize: Int): ProgramConnection

  # Events
  externalEvent(id: ID!): ExternalEvent
  externalEvents(page: Int, pageSize: Int): ExternalEventConnection
  triggerEvent(id: ID!): TriggerEvent
  triggerEvents(page: Int, pageSize: Int): TriggerEventConnection

  # Analytics
  campaignStatistics(campaignId: ID!, dateFrom: DateTime, dateTo: DateTime): CampaignStatistics
  contactBehavior(contactId: ID!, dateFrom: DateTime, dateTo: DateTime): ContactBehavior
  aggregatedReport(filter: ReportFilter!): AggregatedReport

  # SMS
  smsCampaign(id: ID!): SmsCampaign
  smsCampaigns(page: Int, pageSize: Int): SmsCampaignConnection

  # Push Notifications
  pushCampaign(id: ID!): PushCampaign
  pushCampaigns(page: Int, pageSize: Int): PushCampaignConnection

  # Ads
  adCampaign(id: ID!): AdCampaign
  adCampaigns(page: Int, pageSize: Int): AdCampaignConnection

  # Personalization
  personalizedContent(contentId: ID!, contactId: ID!): PersonalizedContent
  contentBlock(id: ID!): ContentBlock
  contentBlocks(page: Int, pageSize: Int): ContentBlockConnection

  # Data management
  dataExport(id: ID!): DataExport
  dataExports(page: Int, pageSize: Int): DataExportConnection

  # Account
  account: Account
  users(page: Int, pageSize: Int): UserConnection
  user(id: ID!): User
}

type Mutation {
  # Contacts
  createContact(input: CreateContactInput!): ContactPayload
  updateContact(id: ID!, input: UpdateContactInput!): ContactPayload
  deleteContact(id: ID!): DeletePayload
  subscribeContact(id: ID!, listId: ID!): ContactPayload
  unsubscribeContact(id: ID!, listId: ID!): ContactPayload
  batchCreateContacts(inputs: [CreateContactInput!]!): BatchContactPayload
  batchUpdateContacts(inputs: [BatchUpdateContactInput!]!): BatchContactPayload

  # Contact Lists
  createContactList(input: CreateContactListInput!): ContactListPayload
  updateContactList(id: ID!, input: UpdateContactListInput!): ContactListPayload
  deleteContactList(id: ID!): DeletePayload
  addContactsToList(listId: ID!, contactIds: [ID!]!): ContactListPayload
  removeContactsFromList(listId: ID!, contactIds: [ID!]!): ContactListPayload

  # Email Campaigns
  createEmailCampaign(input: CreateEmailCampaignInput!): EmailCampaignPayload
  updateEmailCampaign(id: ID!, input: UpdateEmailCampaignInput!): EmailCampaignPayload
  deleteEmailCampaign(id: ID!): DeletePayload
  sendTestEmail(campaignId: ID!, recipientEmail: String!): SendTestEmailPayload

  # Launches
  scheduleLaunch(input: ScheduleLaunchInput!): LaunchPayload
  cancelLaunch(id: ID!): LaunchPayload

  # External Events
  triggerExternalEvent(eventId: ID!, contactId: ID!, data: JSON): ExternalEventTriggerPayload
  createExternalEvent(input: CreateExternalEventInput!): ExternalEventPayload

  # Programs
  startProgram(id: ID!): ProgramPayload
  stopProgram(id: ID!): ProgramPayload
  enrollContactInProgram(programId: ID!, contactId: ID!): ProgramEnrollmentPayload

  # SMS
  createSmsCampaign(input: CreateSmsCampaignInput!): SmsCampaignPayload
  sendSmsCampaign(id: ID!, input: SendSmsCampaignInput!): SmsCampaignPayload

  # Push
  createPushCampaign(input: CreatePushCampaignInput!): PushCampaignPayload
  sendPushCampaign(id: ID!, input: SendPushCampaignInput!): PushCampaignPayload

  # Data export
  createDataExport(input: CreateDataExportInput!): DataExportPayload
}

# ─── Contact Types ─────────────────────────────────────────────────────────────

type Contact {
  id: ID!
  email: String
  firstName: String
  lastName: String
  phone: String
  mobilePhone: String
  dateOfBirth: Date
  gender: Gender
  customFields: [ContactFieldValue!]
  subscriptions: [Subscription!]
  optInStatus: OptInStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  segments: [Segment!]
  lists: [ContactList!]
  behaviors: ContactBehavior
  tags: [String!]
}

type ContactConnection {
  nodes: [Contact!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ContactField {
  id: ID!
  name: String!
  application: String
  stringId: String
  type: FieldType!
  description: String
  required: Boolean!
  defaultValue: String
  options: [FieldOption!]
}

type ContactFieldConnection {
  nodes: [ContactField!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ContactFieldValue {
  field: ContactField!
  value: String
}

type ContactList {
  id: ID!
  name: String!
  type: ContactListType!
  contactCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ContactListConnection {
  nodes: [ContactList!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Subscription {
  listId: ID!
  list: ContactList
  status: SubscriptionStatus!
  optInDate: DateTime
  optOutDate: DateTime
  channel: ChannelType!
}

type ContactBehavior {
  contactId: ID!
  emailsOpened: Int!
  emailsClicked: Int!
  emailsBounced: Int!
  emailsUnsubscribed: Int!
  lastEmailOpen: DateTime
  lastEmailClick: DateTime
  purchaseCount: Int!
  totalPurchaseValue: Float
  lastPurchaseDate: DateTime
  webVisits: Int!
  lastWebVisit: DateTime
  events: [BehaviorEvent!]
}

type BehaviorEvent {
  id: ID!
  type: String!
  timestamp: DateTime!
  properties: JSON
}

# ─── Segment Types ─────────────────────────────────────────────────────────────

type Segment {
  id: ID!
  name: String!
  description: String
  type: SegmentType!
  criteria: SegmentCriteria
  contactCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  status: SegmentStatus!
}

type SegmentConnection {
  nodes: [Segment!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SegmentCriteria {
  rules: [SegmentRule!]!
  operator: LogicalOperator!
}

type SegmentRule {
  field: String!
  operator: FilterOperator!
  value: String
  values: [String!]
}

# ─── Email Campaign Types ───────────────────────────────────────────────────────

type EmailCampaign {
  id: ID!
  name: String!
  subject: String!
  fromName: String!
  fromEmail: String!
  replyTo: String
  contentHtml: String
  contentText: String
  template: EmailTemplate
  type: CampaignType!
  status: CampaignStatus!
  language: String
  personalizations: [Personalization!]
  abTest: AbTest
  createdAt: DateTime!
  updatedAt: DateTime!
  launches: [Launch!]
  statistics: CampaignStatistics
}

type EmailCampaignConnection {
  nodes: [EmailCampaign!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EmailTemplate {
  id: ID!
  name: String!
  description: String
  contentHtml: String!
  contentText: String
  category: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmailTemplateConnection {
  nodes: [EmailTemplate!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AbTest {
  id: ID!
  variants: [AbTestVariant!]!
  winnerCriteria: AbTestWinnerCriteria!
  testDuration: Int
  winnerVariantId: ID
  status: AbTestStatus!
}

type AbTestVariant {
  id: ID!
  name: String!
  subject: String
  fromName: String
  contentHtml: String
  proportion: Float!
}

type Personalization {
  id: ID!
  name: String!
  placeholder: String!
  rule: PersonalizationRule!
  defaultValue: String
}

type PersonalizationRule {
  conditions: [PersonalizationCondition!]!
  operator: LogicalOperator!
}

type PersonalizationCondition {
  field: String!
  operator: FilterOperator!
  value: String!
  content: String!
}

# ─── Launch Types ──────────────────────────────────────────────────────────────

type Launch {
  id: ID!
  campaign: EmailCampaign!
  segment: Segment
  lists: [ContactList!]
  scheduledAt: DateTime
  status: LaunchStatus!
  timezone: String
  throttle: LaunchThrottle
  suppressions: [LaunchSuppression!]
  createdAt: DateTime!
  updatedAt: DateTime!
  statistics: LaunchStatistics
}

type LaunchConnection {
  nodes: [Launch!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LaunchThrottle {
  enabled: Boolean!
  batchSize: Int
  batchIntervalMinutes: Int
}

type LaunchSuppression {
  type: SuppressionType!
  listId: ID
  segmentId: ID
}

type LaunchStatistics {
  sent: Int!
  delivered: Int!
  bounced: Int!
  opened: Int!
  clicked: Int!
  unsubscribed: Int!
  complained: Int!
  openRate: Float!
  clickRate: Float!
  bounceRate: Float!
  unsubscribeRate: Float!
}

# ─── Automation / Program Types ────────────────────────────────────────────────

type Program {
  id: ID!
  name: String!
  description: String
  type: ProgramType!
  status: ProgramStatus!
  trigger: ProgramTrigger
  steps: [ProgramStep!]!
  enrolledContactCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProgramConnection {
  nodes: [Program!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProgramTrigger {
  type: TriggerType!
  eventId: ID
  segmentId: ID
  schedule: String
  conditions: [SegmentRule!]
}

type ProgramStep {
  id: ID!
  name: String!
  type: StepType!
  order: Int!
  config: JSON
  nextStepIds: [ID!]
}

type ProgramEnrollment {
  programId: ID!
  contactId: ID!
  enrolledAt: DateTime!
  currentStepId: ID
  status: EnrollmentStatus!
}

# ─── Event Types ───────────────────────────────────────────────────────────────

type ExternalEvent {
  id: ID!
  name: String!
  description: String
  createdAt: DateTime!
}

type ExternalEventConnection {
  nodes: [ExternalEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TriggerEvent {
  id: ID!
  name: String!
  description: String
  eventType: String!
  schema: JSON
  createdAt: DateTime!
}

type TriggerEventConnection {
  nodes: [TriggerEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# ─── SMS Types ─────────────────────────────────────────────────────────────────

type SmsCampaign {
  id: ID!
  name: String!
  message: String!
  sender: String
  status: CampaignStatus!
  scheduledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
