  /v2/blocklist:
    post:
      summary: Blocklist Emails and Domains
      description: |-
        Adds emails and domains to the internal blocklist. Blocklisted entries are not participating in any campaign.

        **Note:** The maximum batch size is 1000 emails and 1000 domains per call.
      operationId: blocklistEntries
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              emails:
                type: array
                description: List of emails to be put on the blocklist.
                items:
                  type: string
              domains:
                type: array
                description: List of domains to be put on the blocklist.
                items:
                  type: string
            x-examples:
