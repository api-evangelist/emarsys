  name: SAP Engagement Cloud Postman collection
  url: https://github.com/emartech/SAP-Engagement-Cloud-postman-collection
  file: sap_engagement_cloud_postman_collection.json
  auth: OAuth 2.0
  official: true
- kind: postman-collection
  name: SAP Engagement Cloud Postman collection (Beta)
  url: https://github.com/emartech/SAP-Engagement-Cloud-postman-collection-Beta
  official: true
- kind: postman-collection
  name: Emarsys Postman/Bruno collection (WSSE + OIDC)
  url: https://github.com/emartech/Emarsys-postman-collection
  official: true
  note: >-
    Ships both a modern OIDC collection and a wsse_APIs/ folder containing the
    legacy WSSE collections, including a Loyalty Contact API v4 collection and an
    SMS collection not covered by the published OpenAPI.
- kind: bruno
  name: Bruno support in the same repositories
  url: https://github.com/emartech/Emarsys-postman-collection
  official: true
- kind: cli-plugin
  name: httpie-wsse-auth
  url: https://github.com/emartech/httpie-wsse-auth
  official: true
  description: >-
    First-party HTTPie plugin that computes the X-WSSE digest, recommended by the
    docs for command-line testing.
- kind: gui
  name: Request Rocket
  url: https://github.com/emartech/request-rocket
  official: true
  description: >-
    Emarsys' own API test client with WSSE and Escher support. Last commit 2024.
- kind: docs-console
  name: Stoplight "Try It" console
  url: https://dev.emarsys.com/docs/core-api-reference
  official: true
  note: >-
    The reference pages embed a Try It console. It calls the live API with real
