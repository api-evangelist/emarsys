  plan, a price, an included quota or an overage rate. The previously catalogued
  https://emarsys.com/pricing/ URL now returns HTTP 404 and has been replaced by
  the request form. Emarsys is sold as an enterprise SAP subscription, and API
  access is included with the platform rather than metered or priced separately —
  the only published consumption boundary is the rate limit (1000 requests per
  minute per API user, see rate-limits/emarsys-rate-limits.yml), which the docs
  say can be raised by contacting Emarsys.
