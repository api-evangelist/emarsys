note: >-
  SAP Emarsys publishes NO first-party MCP server. Searching the developer hub,
  the emartech GitHub organisation (100+ public repositories, none MCP-related),
  npm and the public MCP registries turns up nothing from SAP or Emarsys. The only
  thing marketed as an "Emarsys MCP Server" is Zapier's generic MCP endpoint,
  which wraps Emarsys through Zapier's own connector — it is a Zapier product on a
  Zapier host with Zapier authentication, not an Emarsys agent surface, and is
  recorded below under third_party rather than as this provider's server. The
  tools[] list is therefore a DERIVED CANDIDATE mapped one-to-one onto real
  operationIds in the harvested specs, offered as a starting point for anyone
  building a server against this API. It is not a claim that any of it is running.
